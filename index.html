<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Image Loader with Lottie Animation</title>
        <meta
            name="description"
            content="A simple image loader that displays a Lottie animation while the image is loading."
        />
        <meta
            name="keywords"
            content="image loader, lottie animation, loading screen"
        />
        <meta name="author" content="Image Loader App" />

        <!-- Open Graph meta tags for social sharing -->
        <meta
            property="og:title"
            content="Image Loader with Lottie Animation"
        />
        <meta
            property="og:description"
            content="A simple image loader with customizable Lottie animations."
        />
        <meta property="og:type" content="website" />

        <!-- Styles -->
        <link rel="stylesheet" href="./src/styles.css" />
        <script type="module" src="./src/app.ts"></script>
    </head>
    <body
        x-data="imageLoader"
        class="m-0 p-0 overflow-hidden font-sans"
        x-cloak
    >
        <div
            class="w-screen h-screen flex justify-center items-center relative"
            :style="'background-color: ' + bgColor"
        >
            <!-- Loader -->
            <div
                class="absolute top-0 left-0 w-full h-full flex justify-center items-center z-10"
                x-show="!showImage"
                x-transition:leave="transition-opacity duration-500 ease-in"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
            >
                <!-- Canvas for Lottie animation -->
                <canvas
                    id="dotlottie-canvas"
                    style="width: 300px; height: 300px"
                ></canvas>
            </div>

            <!-- Image container -->
            <div
                class="absolute top-0 left-0 w-full h-full flex justify-center items-center z-5"
            >
                <img
                    :src="imageUrl"
                    alt="Loaded image"
                    x-show="showImage"
                    class="max-w-full max-h-full object-contain"
                    x-transition:enter="transition-opacity duration-500 ease-out"
                    x-transition:enter-start="opacity-0"
                    x-transition:enter-end="opacity-100"
                />
            </div>
        </div>

        <!-- Add this style to prevent FOUC (Flash Of Unstyled Content) -->
        <style>
            [x-cloak] {
                display: none !important;
            }
        </style>
    </body>
</html>
